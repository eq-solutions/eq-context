name: Rotate pending.md done items

# Nightly per-item rotation of done ("- [x]") items out of eq/sks/ops
# pending.md into their pending-archive.md — scripts/rotate_pending.py.
#
# Why: before this existed, rotation was a one-off manual chore (done once in
# ~12 weeks) whose "zero open items per section" rule let a single trailing
# 'Royce to confirm X' line trap a whole finished session in the live doc.
# eq/pending.md reached 478 open + 163 done-unrotated items before the
# 2026-07-27 backlog analysis forced the issue. Sections dated within the
# last 3 days are left alone (grace window) so follow-on sessions keep
# same-week narrative context.
#
# 2026-08-01: a "Royce to click through live" bullet is the SAME kind of
# trap, one level down — the build is genuinely done, only a live confirm
# is left, but that one line still counted as "open" and pinned the whole
# write-up. Such bullets now rotate out into a separate per-tier
# verify-queue.md instead of blocking the section.
#
# Runs at 11:30 UTC — after suite-state (10:00) and honesty (11:00), before
# digest-refresh (12:00) so the digest's Queue health table reflects the
# rotated state. Commits with [skip ci] so the bot push doesn't re-trigger
# the MD/frontmatter workflows.

on:
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Same group as suite-state-refresh + digest-refresh: serialize every
  # substrate-committing bot so no two ever push to main at once.
  group: eq-context-substrate-push
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The rotation rewrites the substrate's most-read file unattended —
      # run its unit tests first, every night, and refuse to rotate if red.
      - name: Test the rotation engine
        run: python scripts/test_rotate_pending.py

      - name: Rotate done items
        run: python scripts/rotate_pending.py

      - name: Commit if changed
        run: |
          git config user.name  "eq-suite-bot"
          git config user.email "bot@eq.solutions"
          # verify-queue.md is only created per-tier once that tier has a
          # verify item to move (rotate_pending.py's queue_path.write_text
          # is conditional) — a tier with none yet (e.g. ops, 2026-08-05)
          # has no file on disk. A fixed `git add` list fails the whole
          # step with "did not match any files" under `set -e` the moment
          # that happens, silently killing every rotation after it (found
          # 2026-08-05: broke 2026-08-01, 4 nightly runs failed in a row,
          # ~330 done items piled up unrotated in eq/pending.md alone).
          #
          # 2026-08-30: this list still named the single flat `eq/pending.md`
          # from before the 2026-08-17 split into `eq/pending/<repo>.md` (11
          # files — rotate_pending.py's own EQ_LIVE_FILES was updated for the
          # split, this list never was). Every night since: the script
          # correctly computed and WROTE each repo file's rotation to disk,
          # correctly appended to eq/pending-archive.md, but this step only
          # ever staged the now-mostly-static index file — so the archive
          # append committed while the corresponding removal from the real
          # live file never did. Next night's run started from a checkout
          # that still had the "already done" section, rotated it again,
          # appended ANOTHER copy to the archive, forever. Confirmed live:
          # several eq-cards.md/eq-shell.md sections carry 9-25 duplicate
          # "(rotated YYYY-MM-DD)" copies in the archive despite never once
          # actually leaving their live file. Fixed by listing all 11 real
          # files instead of the retired flat path.
          for f in eq/pending/eq-shell.md eq/pending/eq-cards.md eq/pending/eq-field.md \
                   eq/pending/eq-solves-service.md eq/pending/eq-solves-intake.md \
                   eq/pending/eq-design-tokens.md eq/pending/eq-ui.md eq/pending/eq-receipts.md \
                   eq/pending/eq-context.md eq/pending/cross-repo.md eq/pending/sks.md \
                   eq/pending-archive.md eq/verify-queue.md \
                   sks/pending.md sks/pending-archive.md sks/verify-queue.md \
                   ops/pending.md ops/pending-archive.md ops/verify-queue.md; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: nightly pending rotation $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on latest origin/main"
            git pull --rebase --autostash origin main || git rebase --abort || true
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
